# comfy-test config -- https://github.com/PozzettiAndrea/comfy-test
#
# Two intents:
#   * CPU lanes (CI, GitHub-hosted): syntax + install + registration only -- the
#     cheap cross-platform "does it still install and register" canary. No
#     execution: VOSR 2.0 is a 1.4B GPU model.
#   * CUDA lanes (local, or a self-hosted GPU runner): the same three, plus one
#     real end-to-end run of workflows/minimal_vosr_test.json to confirm the
#     model downloads, loads onto the GPU, and produces an image.
#
# "instantiation" is deliberately absent: comfy-test imports the package in a
# bare subprocess with no ComfyUI --cpu context, and loader.py's module-scope
# `import comfy.model_management` runs device detection that raises under
# torch 2.10 on a CPU-only box. The execution level runs against a live server,
# so it is unaffected. Fix = make the comfy.* imports in loader.py lazy, then
# re-add "instantiation".

[test]
levels = ["syntax", "install", "registration", "execution"]

[test.platforms]
platforms = [
    "linux-cpu", "windows-cpu", "windows-portable-cpu", "macos-cpu",
    "linux-cuda", "windows-cuda",
]

[test.workflows]
# CPU lanes run nothing (no `cpu` key). CUDA lanes run just this one workflow.
cuda = ["minimal_vosr_test.json"]
timeout = 3600   # first execute downloads ~7 GB from CSWRY/VOSR into a fresh workspace
